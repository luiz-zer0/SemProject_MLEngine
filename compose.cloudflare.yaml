# Run on an existing, authorized Linux server with Docker Compose v2.
# Secrets must be files OUTSIDE this repository. No public origin port is published.
x-backend: &backend
  image: strathmore-lost-found:local
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  init: true
  environment:
    APP_ENV: production
    FIREBASE_PROJECT_ID: lost-and-found-9671c
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_credentials
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
    WORKER_POLL_SECONDS: "${WORKER_POLL_SECONDS:-30}"
  secrets:
    - firebase_credentials
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  api:
    <<: *backend
    command: ["python", "-m", "uvicorn", "service.api:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  worker:
    <<: *backend
    command: ["python", "-m", "service.worker"]
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets:
      - tunnel_token
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  firebase_credentials:
    file: ${FIREBASE_CREDENTIALS_FILE:?Specify an absolute path outside the checkout}
  tunnel_token:
    file: ${CLOUDFLARE_TOKEN_FILE:?Specify an absolute path outside the checkout}
