name: Execute assessed NLP notebook
on:
  push:
    branches: [deliverable3-compiled-notebook]
    paths: ["notebooks/NLP_Final.ipynb", ".github/workflows/notebook-validation.yml", "matching_system/**", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt nbconvert ipykernel
      - run: python -m jupyter nbconvert --to notebook --execute --inplace notebooks/NLP_Final.ipynb --ExecutePreprocessor.timeout=180
      - name: Print actual executed notebook output
        run: |
          python - <<'PY'
          import nbformat
          n=nbformat.read("notebooks/NLP_Final.ipynb",as_version=4)
          for c in n.cells:
              if c.cell_type == "code":
                  assert c.execution_count is not None
                  for o in c.outputs:
                      if o.output_type == "stream":
                          print(o.text)
          PY
      - name: Commit verified notebook outputs to assessment branch
        if: github.ref == 'refs/heads/deliverable3-compiled-notebook' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/NLP_Final.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Save clean-kernel notebook execution results [skip ci]"
            git push origin HEAD:refs/heads/deliverable3-compiled-notebook
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: executed-NLP-Final
          path: notebooks/NLP_Final.ipynb
