name: Local presentation backend smoke test
on:
  push:
    branches: [main, local-repo-cleanup]
    paths: ["service/**", "matching_system/**", "firebase/**", "scripts/**", "tests/**", "requirements-service.lock.txt", ".github/workflows/local-presentation-validation.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: emulator
      FIREBASE_PROJECT_ID: demo-strathmore-lost-found
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r requirements-service.lock.txt
      - run: npm ci
        working-directory: firebase
      - name: Validate Windows startup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/start_presentation.ps1", [ref]$tokens, [ref]$errors) > $null
          if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
      - name: Exercise real local API, Firestore and NLP worker
        working-directory: firebase
        run: npx firebase emulators:exec --project demo-strathmore-lost-found --only auth,firestore,storage "cd .. && bash scripts/check_local_presentation.sh"
      - name: Full model, API, role and Firebase rules regression tests
        working-directory: firebase
        run: npx firebase emulators:exec --project demo-strathmore-lost-found --only auth,firestore,storage "python ../scripts/verify_local.py"
